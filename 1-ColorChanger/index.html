<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../styles.css" />
</head>

<body style="background-color:white; color:black;">
    <nav>
        <a href="/" aria-current="page">Home</a>
    </nav>
    <div class="canvas">
        <h1> Background Color Changer</h1>
        <span class="button" id="white">White</span>
        <span class="button" id="grey">Grey</span>
        <span class="button" id="blue">Blue</span>
        <span class="button" id="yellow">Yellow</span>
        <span class="button" id="red">Red</span>
        <h2>Try clicking on one of the colors above to change the background color of this page.</h2>
    </div>
    <script src="scriptcolor.js"></script>
</body>

</html>
